name: Wrapper web
on:
  push:
    branches: ['codex/**']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: wrapper-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-publish:
    if: github.repository_owner == 'BullX92'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test scripts/check-own-wrapper.mjs
      - run: npm run type-check
      - run: npm run build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ghcr.io/bullx92/ti4-wrapper-web:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Check the built web container
        run: sh deploy/check-image.sh ghcr.io/bullx92/ti4-wrapper-web:sha-${{ github.sha }}
      - name: Publish the checked web image
        run: docker push ghcr.io/bullx92/ti4-wrapper-web:sha-${{ github.sha }}
